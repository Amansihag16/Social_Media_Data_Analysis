<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%" style="background:#0F172A;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="grad-bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <linearGradient id="grad-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="grad-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="grad-pbi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="480" y="45" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700" letter-spacing="1">
    SocialPulse: End-to-End Big Data Engineering Architecture
  </text>
  <text x="480" y="70" text-anchor="middle" fill="#94A3B8" font-size="13">
    Multi-Source Ingestion • Medallion Architecture (Bronze/Silver/Gold) • NLP Sentiment • Power BI Intelligence
  </text>

  <!-- Section 1: Ingestion Sources -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="240" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="160" y="138" text-anchor="middle" fill="#FF4500" font-size="14" font-weight="600">Reddit API / Feeds</text>
    <text x="160" y="158" text-anchor="middle" fill="#94A3B8" font-size="11">Posts, Scores, Subreddits</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="110" width="240" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="480" y="138" text-anchor="middle" fill="#EF4444" font-size="14" font-weight="600">YouTube Data API v3</text>
    <text x="480" y="158" text-anchor="middle" fill="#94A3B8" font-size="11">Videos, Views, Public Comments</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="110" width="240" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="800" y="138" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="600">Bluesky AT Protocol</text>
    <text x="800" y="158" text-anchor="middle" fill="#94A3B8" font-size="11">Posts, Reposts, Likes, Tags</text>
  </g>

  <!-- Connectors -->
  <line x1="160" y1="180" x2="480" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="4"/>
  <line x1="480" y1="180" x2="480" y2="230" stroke="#475569" stroke-width="2"/>
  <line x1="800" y1="180" x2="480" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="4"/>

  <!-- Section 2: BRONZE LAYER -->
  <g filter="url(#shadow)">
    <rect x="180" y="230" width="600" height="90" rx="10" fill="#1E293B" stroke="url(#grad-bronze)" stroke-width="3"/>
    <text x="480" y="258" text-anchor="middle" fill="#CD7F32" font-size="16" font-weight="700">BRONZE LAYER (Raw Delta Lake Tables)</text>
    <text x="480" y="280" text-anchor="middle" fill="#E2E8F0" font-size="12">Raw Ingestion • Immutability • Ingestion Timestamps • Traceability</text>
    <text x="480" y="302" text-anchor="middle" fill="#94A3B8" font-size="11">bronze_reddit_posts • bronze_youtube_videos • bronze_youtube_comments • bronze_bluesky_posts</text>
  </g>

  <line x1="480" y1="320" x2="480" y2="360" stroke="#64748B" stroke-width="3"/>

  <!-- Section 3: SILVER LAYER -->
  <g filter="url(#shadow)">
    <rect x="180" y="360" width="600" height="110" rx="10" fill="#1E293B" stroke="url(#grad-silver)" stroke-width="3"/>
    <text x="480" y="388" text-anchor="middle" fill="#F1F5F9" font-size="16" font-weight="700">SILVER LAYER (Cleaned, Enriched &amp; Validated Delta)</text>
    <text x="480" y="410" text-anchor="middle" fill="#38BDF8" font-size="12">Deduplication • URL Cleaning • VADER Sentiment Scoring • Hashtag Extraction • DQ Rules</text>
    <text x="480" y="432" text-anchor="middle" fill="#94A3B8" font-size="11">silver_social_posts • silver_social_comments • silver_social_engagement • silver_social_hashtags</text>
    <text x="480" y="452" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">✓ Automated Data Quality Assertions (Zero Null IDs, Valid Timestamps, Non-Negative Metrics)</text>
  </g>

  <line x1="480" y1="470" x2="480" y2="510" stroke="#64748B" stroke-width="3"/>

  <!-- Section 4: GOLD LAYER -->
  <g filter="url(#shadow)">
    <rect x="180" y="510" width="600" height="95" rx="10" fill="#1E293B" stroke="url(#grad-gold)" stroke-width="3"/>
    <text x="480" y="538" text-anchor="middle" fill="#F59E0B" font-size="16" font-weight="700">GOLD LAYER (Business Analytics Delta &amp; CSV)</text>
    <text x="480" y="560" text-anchor="middle" fill="#FDE68A" font-size="12">Star Schema Aggregations • Multi-Platform Benchmarks • Topic Mining • Customer Complaints</text>
    <text x="480" y="582" text-anchor="middle" fill="#94A3B8" font-size="11">gold_sentiment_summary • gold_platform_performance • gold_hashtag_trends • gold_daily_trends • gold_customer_concerns</text>
  </g>

  <line x1="480" y1="605" x2="480" y2="635" stroke="#F59E0B" stroke-width="3"/>

  <!-- Section 5: POWER BI -->
  <g filter="url(#shadow)">
    <rect x="230" y="635" width="500" height="65" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="480" y="660" text-anchor="middle" fill="#FBBF24" font-size="15" font-weight="700">POWER BI EXECUTIVE DASHBOARD (6 Interactive Pages)</text>
    <text x="480" y="680" text-anchor="middle" fill="#E2E8F0" font-size="11">Overview • Sentiment Intelligence • Engagement • Hashtags • Platform Comparison • Customer Concerns</text>
  </g>
</svg>
